[project]
name = "app"
version = "0.0.1"
description = "Feature-based FastAPI boilerplate with optional workers and AI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # core
    "fastapi>=0.162.4",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    # db
    "sqlalchemy[asyncio]>=2.1.8",
    "psycopg[binary]>=3.3.8",
    "alembic[tz]>=1.20.1",
    # observability
    "sentry-sdk>=2.74.0",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
workers = ["celery[redis]>=5.7.0"]
ai = [
    "celery[redis]>=5.7.0",
    "pydantic-ai-slim[bedrock]>=2.67.0",
    "genai-prices>=0.2.3",
]

[dependency-groups]
dev = [
    "complexipy>=8.3.0",
    "factory-boy>=3.3.3",
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC", "N", "T20", "S", "DTZ", "T10", "PT", "PIE", "RET"]
ignore = [
    "E501",  # line-too-long — formatting handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest assertions
"app/core/exceptions.py" = ["N818"]  # APIException mirrors HTTPException naming

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
# The alembic/ directory would otherwise make the alembic *library* look first-party.
known-third-party = ["alembic"]

# Cognitive complexity gate (SonarSource metric): `just complexity`. Functions
# above the limit fail CI — split them instead of raising the limit.
[tool.complexipy]
paths = ["app", "tests", "alembic", "scripts", ".agents"]
max-complexity-allowed = 10

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
# A stale ignore hides a place where the check no longer guards anything.
reportUnnecessaryTypeIgnoreComment = "error"
venvPath = "."
venv = ".venv"
# An explicit include also checks .agents/; the old "**/.*" exclude skipped it.
include = ["app", "tests", "alembic", "scripts", ".agents"]
exclude = ["**/__pycache__", "alembic/versions"]

[tool.pytest]
strict = true
# A new warning fails the suite. Ignore a third-party warning only with an exact filter.
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
