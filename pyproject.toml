[project]
name = "app"
version = "0.0.1"
description = "Feature-based FastAPI boilerplate with optional workers and AI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # core
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    # db
    "sqlalchemy[asyncio]>=2.1.6",
    "psycopg[binary]>=3.3.6",
    "alembic[tz]>=1.20.1",
    # observability
    "sentry-sdk>=2.73.0",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
workers = ["celery[redis]>=5.6.3"]
ai = [
    "celery[redis]>=5.6.3",
    "pydantic-ai-slim[bedrock]>=2.61.0",
    "genai-prices>=0.1.13",
]

[dependency-groups]
dev = [
    "complexipy>=8.2.0",
    "factory-boy>=3.3.3",
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC", "N", "T20", "S", "DTZ", "T10", "PT", "PIE", "RET"]
ignore = [
    "E501",  # line-too-long — formatting handled by ruff format
    "UP046", # keep Generic[T] base (Pydantic generic models); don't force PEP 695
    "UP047", # keep classic generic function syntax
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest assertions
"app/core/exceptions.py" = ["N818"]  # APIException mirrors HTTPException naming

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
# The alembic/ directory would otherwise make the alembic *library* look first-party.
known-third-party = ["alembic"]

# Cognitive complexity gate (SonarSource metric): `just complexity`. Functions
# above the limit fail CI — split them instead of raising the limit.
[tool.complexipy]
paths = ["app", "tests", "alembic"]
max-complexity-allowed = 10

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
