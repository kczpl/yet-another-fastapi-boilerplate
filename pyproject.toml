[project]
name = "app"
version = "0.0.1"
description = "Feature-based FastAPI boilerplate with optional workers and AI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # core
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    # db
    "sqlalchemy[asyncio]>=2.1.6",
    "psycopg[binary]>=3.3.6",
    "alembic[tz]>=1.20.1",
    # observability
    "sentry-sdk>=2.73.0",
    "structlog>=26.1.0",
]

[project.optional-dependencies]
workers = ["celery[redis]>=5.6.3"]
ai = [
    "celery[redis]>=5.6.3",
    "pydantic-ai-slim[bedrock]>=2.61.0",
    "genai-prices>=0.1.13",
]

[dependency-groups]
dev = [
    "complexipy>=8.2.0",
    "factory-boy>=3.3.3",
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC", "N", "T20", "S", "DTZ", "T10", "PT", "PIE", "RET", "PGH", "TID251", "TID252"]
ignore = [
    "E501",  # line-too-long — formatting handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
# Tests assert and build their own sessions and engines. Scripts are command-line tools.
"tests/**" = ["S101", "TID251"]
"scripts/**" = ["TID251"]
"app/core/exceptions.py" = ["N818"]  # APIException mirrors HTTPException naming
# Each wrapper below is the one module that may use its banned API.
"app/core/db.py" = ["TID251"]
"app/core/logger.py" = ["TID251"]
"app/core/agents.py" = ["TID251"]
"app/workers/registry.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports]
# The import direction test reads absolute imports only.
ban-relative-imports = "all"

# Each banned API has one wrapper. The message names it. `just gates` ignores noqa comments.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"app.core.db.SessionLocal".msg = "Use the get_db dependency in a route or session_scope() in a worker. They own the transaction."
"structlog.get_logger".msg = "Use log from app.core.logger. The log field test reads only the log calls."
"logging.getLogger".msg = "Use log from app.core.logger. The log field test reads only the log calls."
"pydantic_ai.models.bedrock.BedrockConverseModel".msg = "Use get_model() from app.core.agents. It makes one provider per process, after the fork."
"pydantic_ai.providers.bedrock.BedrockProvider".msg = "Use get_model() from app.core.agents. It makes one provider per process, after the fork."
"app.workers.celery.celery.task".msg = "Use @celery_task(...) from app.workers.registry. It gives the task the BaseTask type."
"celery.shared_task".msg = "Use @celery_task(...) from app.workers.registry. It gives the task the BaseTask type."

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
# The alembic/ directory would otherwise make the alembic *library* look first-party.
known-third-party = ["alembic"]

# Cognitive complexity gate (SonarSource metric): `just complexity`. Functions
# above the limit fail CI — split them instead of raising the limit.
[tool.complexipy]
paths = ["app", "tests", "alembic", "scripts", ".agents"]
max-complexity-allowed = 10

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
# A stale ignore hides a place where the check no longer guards anything.
reportUnnecessaryTypeIgnoreComment = "error"
venvPath = "."
venv = ".venv"
# An explicit include also checks .agents/; the old "**/.*" exclude skipped it.
include = ["app", "tests", "alembic", "scripts", ".agents"]
exclude = ["**/__pycache__", "alembic/versions"]

[tool.pytest]
strict = true
# A new warning fails the suite. Ignore a third-party warning only with an exact filter.
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
