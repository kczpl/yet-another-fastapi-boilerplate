x-app: &app
  build:
    context: .
    args:
      APP_EXTRA: ${APP_EXTRA:-}
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://app:app@postgres:5432/app}
    REDIS_URL: redis://redis:6379/0

services:
  api:
    <<: *app
    command: /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    <<: *app
    command: /app/.venv/bin/alembic -c alembic/alembic.ini upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  workers:
    <<: *app
    profiles: [workers]
    build:
      context: .
      args:
        APP_EXTRA: ${APP_EXTRA:-workers}
    command: /app/.venv/bin/watchfiles --filter python "/app/.venv/bin/celery -A app.workers.celery:celery worker --loglevel=info -Q default,heavy" ./app
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  cron:
    <<: *app
    profiles: [workers]
    build:
      context: .
      args:
        APP_EXTRA: ${APP_EXTRA:-workers}
    command: /app/.venv/bin/celery -A app.workers.celery:celery beat --loglevel=info
    volumes:
      - ./app:/app/app
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 10

  postgres-test:
    image: postgres:18
    profiles: [test]
    environment:
      POSTGRES_USER: app_test
      POSTGRES_PASSWORD: app_test
      POSTGRES_DB: app_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_test -d app_test"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: [workers]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  postgres_data:
  redis_data:
